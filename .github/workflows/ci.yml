name: tests

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan source and complete reachable Git history
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts="--all"
          "$RUNNER_TEMP/gitleaks" dir . --redact
  core-and-server:
    # The plug-in needs the Autodesk DLLs and is built on a machine with Civil 3D (scripts/install.ps1);
    # Core and Server - contract, permissions, validation, engines, exchange formats - are tested here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Unit tests (no Civil 3D)
        run: dotnet test tests/Horizun.Civil3D.Core.Tests -c Release --nologo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Revit mesh receiver guards (no Revit)
        run: python scripts/import-revit-terrain-mesh.tests.py
      - name: Acceptance client safeguards
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Runtime parity (.NET Framework 4.8, .NET 8 and .NET 10)
        run: dotnet test tests/Horizun.Civil3D.Runtime.Tests -c Release --nologo
      - name: Installer and ChatGPT integration tests (PowerShell 5.1)
        shell: powershell
        run: |
          & ./scripts/claude-desktop-registration.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/install-rollback.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/register-plugin-trust.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pluginTestServer = Join-Path $env:RUNNER_TEMP 'c3d-plugin-test-server'
          dotnet publish src/Horizun.Civil3D.Server/Horizun.Civil3D.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $pluginTestServer --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/plugin.tests.ps1 -PublishedServerPath (Join-Path $pluginTestServer 'horizun-civil3d-mcp.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/runtime-build.tests.ps1 -PublishedServerPath (Join-Path $pluginTestServer 'horizun-civil3d-mcp.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-plugin.tests.ps1 -MetadataOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/revit-terrain.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/chatgpt-tunnel.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
